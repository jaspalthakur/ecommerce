<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop · Working Cart</title>
  <style>
    /* ---------- RESET & BASE ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #eef4fc 0%, #e2ecf7 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #0b1a2b;
      line-height: 1.5;
    }

    .app {
      max-width: 980px;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.25), 0 8px 20px -8px rgba(0, 0, 0, 0.08);
      padding: 2rem 2rem 2.2rem;
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b2b3b;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }

    h1::before {
      content: "🛍️";
      font-size: 2rem;
      line-height: 1;
    }

    .subtitle {
      color: #4f6c7e;
      font-size: 0.95rem;
      font-weight: 450;
      margin-bottom: 1.8rem;
    }

    /* ---------- LAYOUT: PRODUCTS + CART ---------- */
    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.8rem;
      align-items: start;
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- PRODUCT GRID ---------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: white;
      border-radius: 1.4rem;
      padding: 1.4rem 1.2rem 1.2rem;
      border: 1px solid #e0ecf5;
      box-shadow: 0 4px 12px -6px rgba(0, 30, 50, 0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px -8px rgba(0, 30, 50, 0.18);
    }

    .product-emoji {
      font-size: 2.4rem;
      line-height: 1;
      margin-bottom: 0.6rem;
    }

    .product-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #12303f;
      margin-bottom: 0.2rem;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1d5e7a;
      margin-bottom: 1rem;
    }

    .add-btn {
      margin-top: auto;
      background: #e2eef7;
      color: #1d5e7a;
      border: 1px solid #cbdce9;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.2px;
    }

    .add-btn:hover {
      background: #1d5e7a;
      color: white;
      border-color: #1d5e7a;
      transform: scale(1.02);
    }

    .add-btn:active {
      transform: scale(0.98);
    }

    .add-btn:focus-visible {
      outline: 3px solid #2a6b8c;
      outline-offset: 2px;
    }

    /* ---------- CART PANEL ---------- */
    .cart-panel {
      background: white;
      border-radius: 1.6rem;
      padding: 1.5rem 1.4rem;
      border: 1px solid #e0ecf5;
      box-shadow: 0 8px 20px -10px rgba(0, 30, 50, 0.12);
      position: sticky;
      top: 1.5rem;
    }

    .cart-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #12303f;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .cart-title::before {
      content: "🛒";
      font-size: 1.2rem;
    }

    .cart-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cart-items::-webkit-scrollbar {
      width: 5px;
    }

    .cart-items::-webkit-scrollbar-track {
      background: #ecf2f8;
      border-radius: 10px;
    }

    .cart-items::-webkit-scrollbar-thumb {
      background: #b7cbd9;
      border-radius: 10px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #f0f5fa;
      font-size: 0.92rem;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-name {
      flex: 1;
      font-weight: 600;
      color: #1e3d4e;
      word-break: break-word;
    }

    .cart-qty {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid #cbdce9;
      background: #f4f9ff;
      color: #1d5e7a;
      font-weight: 700;
      font-size: 0.9rem;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
    }

    .qty-btn:hover {
      background: #dbeaf7;
      border-color: #a8c4d8;
    }

    .qty-btn:focus-visible {
      outline: 2px solid #2a6b8c;
      outline-offset: 1px;
    }

    .qty-value {
      min-width: 18px;
      text-align: center;
      font-weight: 700;
      color: #12303f;
    }

    .cart-line-price {
      font-weight: 600;
      color: #1d5e7a;
      min-width: 52px;
      text-align: right;
      font-size: 0.85rem;
    }

    .empty-cart-msg {
      text-align: center;
      padding: 1.6rem 0.5rem;
      color: #9bb1c0;
      font-style: italic;
      font-size: 0.92rem;
    }

    /* ---------- TOTALS ---------- */
    .totals {
      border-top: 1px solid #e6eef5;
      padding-top: 1rem;
      margin-top: 0.4rem;
      font-size: 0.92rem;
      color: #2e4d5e;
    }

    .totals-row {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
    }

    .totals-row.total {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0b2b3b;
      margin-top: 0.4rem;
      border-top: 1px dashed #d3e2ef;
      padding-top: 0.7rem;
    }

    .delivery-note {
      font-size: 0.78rem;
      color: #7a94a6;
      margin-top: 0.3rem;
      font-weight: 450;
    }

    /* ---------- CHECKOUT BUTTON ---------- */
    .checkout-btn {
      width: 100%;
      margin-top: 1.1rem;
      background: #1c5e42;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 8px 16px -6px #1c5e4280;
      letter-spacing: 0.2px;
    }

    .checkout-btn:hover:not(:disabled) {
      background: #144b34;
      transform: scale(1.02);
      box-shadow: 0 10px 20px -6px #1c5e42cc;
    }

    .checkout-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .checkout-btn:disabled {
      background: #c3d3dc;
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.7;
    }

    .checkout-btn:focus-visible {
      outline: 3px solid #2a6b8c;
      outline-offset: 2px;
    }

    /* ---------- MODAL ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 40, 0.5);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: white;
      border-radius: 2rem;
      max-width: 460px;
      width: 100%;
      padding: 2rem 1.8rem 1.8rem;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35);
      animation: slideUp 0.25s ease;
      max-height: 85vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0b2b3b;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .modal h2::before {
      content: "🧾";
      font-size: 1.3rem;
    }

    .modal .demo-note {
      background: #fff7e6;
      border: 1px solid #f5dfa8;
      color: #7a5b13;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.5rem 0.9rem;
      border-radius: 12px;
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .modal-items {
      list-style: none;
      margin-bottom: 1rem;
      border-top: 1px solid #eef4f9;
    }

    .modal-items li {
      display: flex;
      justify-content: space-between;
      padding: 0.55rem 0;
      border-bottom: 1px solid #eef4f9;
      font-size: 0.92rem;
      color: #1e3d4e;
    }

    .modal-items li span:last-child {
      font-weight: 600;
      color: #1d5e7a;
    }

    .modal-totals {
      font-size: 0.92rem;
      color: #2e4d5e;
      margin-bottom: 1.4rem;
    }

    .modal-totals .row {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
    }

    .modal-totals .row.total {
      font-weight: 800;
      font-size: 1.15rem;
      color: #0b2b3b;
      border-top: 1px dashed #d3e2ef;
      margin-top: 0.4rem;
      padding-top: 0.7rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.7rem;
    }

    .modal-actions button {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 60px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-secondary {
      background: #eef4fa;
      color: #2e4d5e;
      border: 1px solid #d3e2ef;
    }

    .btn-secondary:hover {
      background: #e0ecf5;
    }

    .btn-primary {
      background: #1c5e42;
      color: white;
      box-shadow: 0 6px 14px -6px #1c5e4299;
    }

    .btn-primary:hover {
      background: #144b34;
    }

    .modal-actions button:focus-visible {
      outline: 3px solid #2a6b8c;
      outline-offset: 2px;
    }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #12303f;
      color: white;
      font-size: 0.88rem;
      font-weight: 500;
      padding: 0.7rem 1.4rem;
      border-radius: 60px;
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 200;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- REDUCED MOTION ---------- */
    @media (prefers-reduced-motion: reduce) {
      .product-card,
      .checkout-btn,
      .add-btn,
      .modal-backdrop.open,
      .modal,
      .toast {
        transition: none;
        animation: none;
      }
      .product-card:hover,
      .checkout-btn:hover:not(:disabled),
      .add-btn:hover {
        transform: none;
      }
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      body {
        padding: 1rem 0.8rem;
      }
      .app {
        padding: 1.5rem 1.2rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }
      .cart-panel {
        padding: 1.2rem 1rem;
      }
      .modal {
        padding: 1.6rem 1.2rem 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mini shop</h1>
    <p class="subtitle">Pick a few items — your cart is saved between visits.</p>

    <div class="layout">
      <!-- ---------- PRODUCTS ---------- -->
      <section aria-label="Products">
        <div id="productGrid" class="product-grid"></div>
      </section>

      <!-- ---------- CART ---------- -->
      <aside class="cart-panel" aria-label="Shopping cart">
        <div class="cart-title">Your cart</div>

        <ul id="cartItems" class="cart-items"></ul>

        <div class="totals" id="totalsBox">
          <div class="totals-row">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
          </div>
          <div class="totals-row">
            <span>Delivery</span>
            <span id="delivery">₹0</span>
          </div>
          <div class="totals-row total">
            <span>Total</span>
            <span id="total">₹0</span>
          </div>
          <div class="delivery-note" id="deliveryNote"></div>
        </div>

        <button id="checkoutBtn" class="checkout-btn" disabled>Checkout</button>
      </aside>
    </div>
  </div>

  <!-- ---------- MODAL ---------- -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Order preview</h2>
      <div class="demo-note">
        🔒 Demo only — no real payment, no card details required.
      </div>
      <ul id="modalItems" class="modal-items"></ul>
      <div class="modal-totals" id="modalTotals"></div>
      <div class="modal-actions">
        <button id="closeModalBtn" class="btn-secondary">Back to shop</button>
        <button id="confirmOrderBtn" class="btn-primary">Place demo order</button>
      </div>
    </div>
  </div>

  <!-- ---------- TOAST ---------- -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function() {
      // ============================================================
      // DATA — products come from this array, not hand-written HTML
      // ============================================================
      var products = [
        { id: 1, name: "Notebook",   price: 120, emoji: "📓" },
        { id: 2, name: "Pen pack",   price: 80,  emoji: "🖊️" },
        { id: 3, name: "Desk lamp",  price: 650, emoji: "💡" },
        { id: 4, name: "Mug",        price: 220, emoji: "☕" },
        { id: 5, name: "Backpack",   price: 890, emoji: "🎒" },
        { id: 6, name: "Sticky notes", price: 60, emoji: "🗒️" }
      ];

      // Delivery rule: free over ₹500, otherwise ₹40
      var DELIVERY_FEE = 40;
      var FREE_DELIVERY_THRESHOLD = 500;

      // ---------- STATE ----------
      // cart is an object: { [productId]: quantity }
      var cart = loadCart();

      // ---------- DOM ----------
      var productGrid   = document.getElementById("productGrid");
      var cartItemsEl   = document.getElementById("cartItems");
      var subtotalEl    = document.getElementById("subtotal");
      var deliveryEl    = document.getElementById("delivery");
      var totalEl       = document.getElementById("total");
      var deliveryNote  = document.getElementById("deliveryNote");
      var checkoutBtn   = document.getElementById("checkoutBtn");
      var modalBackdrop = document.getElementById("modalBackdrop");
      var modalItems    = document.getElementById("modalItems");
      var modalTotals   = document.getElementById("modalTotals");
      var closeModalBtn = document.getElementById("closeModalBtn");
      var confirmOrderBtn = document.getElementById("confirmOrderBtn");
      var toastEl       = document.getElementById("toast");

      var toastTimer = null;

      // ---------- LOCALSTORAGE ----------
      function loadCart() {
        try {
          var raw = localStorage.getItem("shop_cart");
          if (!raw) return {};
          var parsed = JSON.parse(raw);
          // Validate: keep only known product ids with positive integer quantities
          var clean = {};
          if (parsed && typeof parsed === "object") {
            Object.keys(parsed).forEach(function (idKey) {
              var id = Number(idKey);
              var qty = parsed[idKey];
              var exists = products.some(function (p) { return p.id === id; });
              if (exists && Number.isInteger(qty) && qty > 0) {
                clean[id] = qty;
              }
            });
          }
          return clean;
        } catch (e) {
          return {};
        }
      }

      function saveCart() {
        try {
          localStorage.setItem("shop_cart", JSON.stringify(cart));
        } catch (e) {
          // localStorage might be full or unavailable — ignore
        }
        render();
      }

      // ---------- HELPERS ----------
      function findProduct(id) {
        return products.find(function (p) { return p.id === Number(id); });
      }

      function formatINR(amount) {
        return amount.toLocaleString("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0
        });
      }

      function cartItemCount() {
        return Object.keys(cart).reduce(function (sum, id) {
          return sum + cart[id];
        }, 0);
      }

      function computeTotals() {
        var subtotal = Object.keys(cart).reduce(function (sum, id) {
          var p = findProduct(id);
          if (!p) return sum;
          return sum + p.price * cart[id];
        }, 0);

        var delivery = 0;
        if (subtotal > 0 && subtotal < FREE_DELIVERY_THRESHOLD) {
          delivery = DELIVERY_FEE;
        }
        return {
          subtotal: subtotal,
          delivery: delivery,
          total: subtotal + delivery
        };
      }

      function showToast(message) {
        toastEl.textContent = message;
        toastEl.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 1800);
      }

      // ---------- ACTIONS ----------
      function addToCart(id) {
        var product = findProduct(id);
        if (!product) return;
        cart[id] = (cart[id] || 0) + 1;
        saveCart();
        showToast(product.name + " added to cart");
      }

      function changeQuantity(id, delta) {
        if (!cart[id]) return;
        cart[id] = cart[id] + delta;
        if (cart[id] <= 0) {
          delete cart[id];
        }
        saveCart();
      }

      function removeItem(id) {
        if (cart[id]) {
          delete cart[id];
          saveCart();
        }
      }

      // ---------- RENDER: PRODUCTS ----------
      function renderProducts() {
        productGrid.innerHTML = "";
        products.forEach(function (p) {
          var card = document.createElement("div");
          card.className = "product-card";

          var emoji = document.createElement("div");
          emoji.className = "product-emoji";
          emoji.textContent = p.emoji;

          var name = document.createElement("div");
          name.className = "product-name";
          name.textContent = p.name;

          var price = document.createElement("div");
          price.className = "product-price";
          price.textContent = formatINR(p.price);

          var btn = document.createElement("button");
          btn.className = "add-btn";
          btn.type = "button";
          btn.textContent = "Add to cart";
          btn.dataset.productId = p.id;
          btn.addEventListener("click", function () {
            addToCart(p.id);
          });

          card.append(emoji, name, price, btn);
          productGrid.appendChild(card);
        });
      }

      // ---------- RENDER: CART ----------
      function renderCart() {
        var ids = Object.keys(cart);

        // Empty state
        if (ids.length === 0) {
          cartItemsEl.innerHTML = '<li class="empty-cart-msg">Your cart is empty — add something nice.</li>';
        } else {
          cartItemsEl.innerHTML = "";
          ids.forEach(function (idKey) {
            var id = Number(idKey);
            var p = findProduct(id);
            if (!p) return;
            var qty = cart[id];
            var lineTotal = p.price * qty;

            var li = document.createElement("li");
            li.className = "cart-item";

            var nameEl = document.createElement("span");
            nameEl.className = "cart-item-name";
            nameEl.textContent = p.name;

            var qtyWrap = document.createElement("span");
            qtyWrap.className = "cart-qty";

            var minus = document.createElement("button");
            minus.type = "button";
            minus.className = "qty-btn";
            minus.textContent = "−";
            minus.setAttribute("aria-label", "Decrease quantity of " + p.name);
            minus.addEventListener("click", function () {
              changeQuantity(id, -1);
            });

            var qtyVal = document.createElement("span");
            qtyVal.className = "qty-value";
            qtyVal.textContent = qty;

            var plus = document.createElement("button");
            plus.type = "button";
            plus.className = "qty-btn";
            plus.textContent = "+";
            plus.setAttribute("aria-label", "Increase quantity of " + p.name);
            plus.addEventListener("click", function () {
              changeQuantity(id, 1);
            });

            qtyWrap.append(minus, qtyVal, plus);

            var linePrice = document.createElement("span");
            linePrice.className = "cart-line-price";
            linePrice.textContent = formatINR(lineTotal);

            // Remove button (only when quantity is 1, it acts as remove)
            var removeBtn = document.createElement("button");
            removeBtn.type = "button";
            removeBtn.className = "qty-btn";
            removeBtn.textContent = "✕";
            removeBtn.setAttribute("aria-label", "Remove " + p.name + " from cart");
            removeBtn.style.color = "#b13e32";
            removeBtn.style.borderColor = "#f5d6d2";
            removeBtn.style.background = "#fcefed";
            removeBtn.addEventListener("click", function () {
              removeItem(id);
            });

            li.append(nameEl, qtyWrap, linePrice, removeBtn);
            cartItemsEl.appendChild(li);
          });
        }

        // Totals
        var t = computeTotals();
        subtotalEl.textContent = formatINR(t.subtotal);
        deliveryEl.textContent = t.delivery === 0 ? "Free" : formatINR(t.delivery);
        totalEl.textContent = formatINR(t.total);

        // Delivery note
        if (t.subtotal === 0) {
          deliveryNote.textContent = "";
        } else if (t.subtotal >= FREE_DELIVERY_THRESHOLD) {
          deliveryNote.textContent = "🎉 You qualify for free delivery!";
        } else {
          var remaining = FREE_DELIVERY_THRESHOLD - t.subtotal;
          deliveryNote.textContent = "Add " + formatINR(remaining) + " more for free delivery.";
        }

        // Checkout button state
        checkoutBtn.disabled = cartItemCount() === 0;
      }

      // ---------- RENDER: MODAL ----------
      function renderModal() {
        modalItems.innerHTML = "";
        Object.keys(cart).forEach(function (idKey) {
          var id = Number(idKey);
          var p = findProduct(id);
          if (!p) return;
          var qty = cart[id];
          var li = document.createElement("li");
          var left = document.createElement("span");
          left.textContent = p.name + " × " + qty;
          var right = document.createElement("span");
          right.textContent = formatINR(p.price * qty);
          li.append(left, right);
          modalItems.appendChild(li);
        });

        var t = computeTotals();
        modalTotals.innerHTML = "";
        var subtotalRow = document.createElement("div");
        subtotalRow.className = "row";
        subtotalRow.innerHTML = "<span>Subtotal</span><span>" + formatINR(t.subtotal) + "</span>";

        var deliveryRow = document.createElement("div");
        deliveryRow.className = "row";
        deliveryRow.innerHTML = "<span>Delivery</span><span>" +
          (t.delivery === 0 ? "Free" : formatINR(t.delivery)) + "</span>";

        var totalRow = document.createElement("div");
        totalRow.className = "row total";
        totalRow.innerHTML = "<span>Total</span><span>" + formatINR(t.total) + "</span>";

        modalTotals.append(subtotalRow, deliveryRow, totalRow);
      }

      // ---------- MASTER RENDER ----------
      function render() {
        renderCart();
      }

      // ---------- MODAL CONTROLS ----------
      function openModal() {
        if (cartItemCount() === 0) return;
        renderModal();
        modalBackdrop.classList.add("open");
        // Move focus to first modal button for accessibility
        setTimeout(function () {
          closeModalBtn.focus();
        }, 50);
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        checkoutBtn.focus();
      }

      // Trap focus inside modal (simple implementation)
      function trapFocus(e) {
        if (!modalBackdrop.classList.contains("open")) return;
        if (e.key !== "Tab") return;

        var focusable = modalBackdrop.querySelectorAll("button");
        if (focusable.length === 0) return;
        var first = focusable[0];
        var last = focusable[focusable.length - 1];

        if (e.shiftKey) {
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else {
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }

      // ---------- EVENT LISTENERS ----------
      checkoutBtn.addEventListener("click", openModal);
      closeModalBtn.addEventListener("click", closeModal);

      // Close on backdrop click
      modalBackdrop.addEventListener("click", function (e) {
        if (e.target === modalBackdrop) closeModal();
      });

      // Close on Escape
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modalBackdrop.classList.contains("open")) {
          closeModal();
        }
        trapFocus(e);
      });

      // Confirm demo order
      confirmOrderBtn.addEventListener("click", function () {
        // Clear cart
        cart = {};
        saveCart();
        closeModal();
        showToast("✅ Demo order placed — cart cleared");
      });

      // ---------- INIT ----------
      renderProducts();
      renderCart();
    })();
  </script>
</body>
</html>
